name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test core
        run: ./gradlew :pip-core:test
      - name: Build libraries and sample
        run: ./gradlew :pip:assembleRelease :pip-media3:assembleRelease :sample:assembleDebug
      - name: Verify publishing (what JitPack runs)
        run: ./gradlew publishToMavenLocal

  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (PiP screenshot check)
        run: python3 -m pip install pillow
      - uses: gradle/actions/setup-gradle@v5
      - name: Build sample
        run: ./gradlew :sample:assembleDebug
      - name: Capture phone screenshots
        # The player, then Home: the sample auto-enters PiP and the real PiP window is captured over the launcher.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: phone
          script: bash scripts/screenshots.sh phone
      - name: Capture tablet screenshot (landscape)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          avd-name: tablet
          script: bash scripts/screenshots.sh tablet
      - name: Capture Android TV screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          avd-name: tv
          script: bash scripts/screenshots.sh tv
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi

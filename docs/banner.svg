<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-pip: picture-in-picture for Compose video screens on phone, tablet and TV" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E1A"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#231a3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7CE0C3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7CE0C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a1e"/>
      <stop offset="1" stop-color="#16294a"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2be0a0"/>
      <stop offset="0.5" stop-color="#3ad1e6"/>
      <stop offset="1" stop-color="#8a6bff"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2160"/>
      <stop offset="0.62" stop-color="#ff9c78"/>
      <stop offset="0.62" stop-color="#c76a7a"/>
      <stop offset="1" stop-color="#1d1a4a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3b5c"/>
      <stop offset="1" stop-color="#3b2a5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tvScreen"><rect x="742" y="70" width="470" height="264" rx="10"/></clipPath>
    <clipPath id="phoneScreen"><rect x="672" y="182" width="190" height="352" rx="22"/></clipPath>
    <clipPath id="pipClip"><rect x="736" y="398" width="116" height="65" rx="9"/></clipPath>
    <clipPath id="tvPipClip"><rect x="1062" y="232" width="132" height="74" rx="8"/></clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="72" y="168" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#F2F4FA">compose-pip</text>
  <text x="74" y="216" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#B7BED3">Picture-in-picture for Compose video screens</text>
  <text x="74" y="248" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#B7BED3">on phone, tablet and TV</text>

  <!-- Feature chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="72" y="292" width="124" height="38" rx="19" fill="#7CE0C3"/>
    <text x="134" y="317" text-anchor="middle" fill="#0B1A16">Auto-enter</text>
    <rect x="206" y="292" width="160" height="38" rx="19" fill="none" stroke="#7CE0C3" stroke-width="1.6"/>
    <text x="286" y="317" text-anchor="middle" fill="#DDF7EF">Custom actions</text>
    <rect x="376" y="292" width="134" height="38" rx="19" fill="none" stroke="#7CE0C3" stroke-width="1.6"/>
    <text x="443" y="317" text-anchor="middle" fill="#DDF7EF">Aspect ratio</text>

    <rect x="72" y="342" width="178" height="38" rx="19" fill="none" stroke="#FFB27A" stroke-width="1.6"/>
    <text x="161" y="367" text-anchor="middle" fill="#FFE3CF">Source rect hint</text>
    <rect x="260" y="342" width="172" height="38" rx="19" fill="none" stroke="#FFB27A" stroke-width="1.6"/>
    <text x="346" y="367" text-anchor="middle" fill="#FFE3CF">Seamless resize</text>
    <rect x="442" y="342" width="98" height="38" rx="19" fill="#FFB27A"/>
    <text x="491" y="367" text-anchor="middle" fill="#3A1C05">Media3</text>

    <rect x="72" y="392" width="226" height="38" rx="19" fill="none" stroke="#8E97B5" stroke-width="1.6"/>
    <text x="185" y="417" text-anchor="middle" fill="#D7DBE8">Phone · Tablet · TV</text>
    <rect x="308" y="392" width="170" height="38" rx="19" fill="none" stroke="#8E97B5" stroke-width="1.6"/>
    <text x="393" y="417" text-anchor="middle" fill="#D7DBE8">PiP-aware UI</text>
  </g>

  <!-- TV with a video and its own PiP inset -->
  <g filter="url(#shadow)">
    <rect x="730" y="58" width="494" height="288" rx="18" fill="#05070d" stroke="#2c3350" stroke-width="2"/>
  </g>
  <g clip-path="url(#tvScreen)">
    <rect x="742" y="70" width="470" height="264" fill="url(#sky)"/>
    <path d="M742,150 C820,110 880,170 960,128 C1040,88 1110,150 1212,112 L1212,170 C1110,205 1040,150 960,186 C880,222 820,168 742,206 Z" fill="url(#aurora)" opacity="0.55"/>
    <path d="M742,128 C830,96 900,140 980,108 C1060,78 1130,120 1212,92 L1212,118 C1130,146 1060,104 980,134 C900,166 830,122 742,156 Z" fill="url(#aurora)" opacity="0.35"/>
    <circle cx="790" cy="92" r="1.6" fill="#fff"/><circle cx="870" cy="84" r="1.2" fill="#fff"/><circle cx="1010" cy="80" r="1.4" fill="#fff"/><circle cx="1150" cy="98" r="1.2" fill="#fff"/><circle cx="1180" cy="76" r="1.6" fill="#fff"/>
    <path d="M742,334 L742,268 C790,250 840,262 890,246 C950,228 1000,258 1060,242 C1120,228 1170,250 1212,240 L1212,334 Z" fill="#0b1222"/>
    <rect x="742" y="276" width="470" height="58" fill="#000" opacity="0.35"/>
    <rect x="768" y="300" width="300" height="5" rx="2.5" fill="#ffffff" opacity="0.3"/>
    <rect x="768" y="300" width="128" height="5" rx="2.5" fill="#7CE0C3"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="1062" y="232" width="132" height="74" rx="8" fill="url(#sunset)"/>
  </g>
  <g clip-path="url(#tvPipClip)">
    <circle cx="1128" cy="276" r="11" fill="#ffe2aa"/>
    <rect x="1062" y="278" width="132" height="2" fill="#ffd9a8" opacity="0.6"/>
  </g>
  <rect x="1062" y="232" width="132" height="74" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="940" y="346" width="74" height="12" rx="3" fill="#1a2036"/>
  <rect x="900" y="356" width="154" height="6" rx="3" fill="#1a2036"/>

  <!-- Phone showing the launcher with a floating PiP window -->
  <g filter="url(#shadow)">
    <rect x="660" y="170" width="214" height="376" rx="32" fill="#0a0c14" stroke="#353d5c" stroke-width="2"/>
  </g>
  <g clip-path="url(#phoneScreen)">
    <rect x="672" y="182" width="190" height="352" fill="url(#wall)"/>
    <!-- Clock and search bar -->
    <rect x="700" y="214" width="78" height="20" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="700" y="242" width="52" height="9" rx="4.5" fill="#ffffff" opacity="0.45"/>
    <!-- App icon grid -->
    <g fill="#ffffff" opacity="0.22">
      <circle cx="704" cy="300" r="14"/><circle cx="748" cy="300" r="14"/><circle cx="792" cy="300" r="14"/><circle cx="836" cy="300" r="14"/>
      <circle cx="704" cy="346" r="14"/><circle cx="748" cy="346" r="14"/><circle cx="792" cy="346" r="14"/><circle cx="836" cy="346" r="14"/>
    </g>
    <rect x="690" y="492" width="154" height="26" rx="13" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- The PiP window -->
  <g filter="url(#shadow)">
    <rect x="736" y="398" width="116" height="65" rx="9" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#pipClip)">
    <path d="M736,432 C760,414 784,438 806,420 C824,406 840,424 852,414 L852,436 C840,446 824,428 806,442 C784,460 760,436 736,452 Z" fill="url(#aurora)" opacity="0.7"/>
    <path d="M736,463 L736,450 C760,444 782,452 806,446 C826,441 840,448 852,446 L852,463 Z" fill="#0b1222"/>
    <rect x="736" y="398" width="116" height="65" fill="#000" opacity="0.28"/>
  </g>
  <rect x="736" y="398" width="116" height="65" rx="9" fill="none" stroke="#7CE0C3" stroke-width="2"/>
  <!-- Previous, pause, next actions -->
  <g fill="#ffffff">
    <path d="M766,424 h3 v14 h-3 z M770,431 l9,-7 v14 z"/>
    <path d="M788,424 h4 v14 h-4 z M796,424 h4 v14 h-4 z"/>
    <path d="M808,424 l9,7 l-9,7 z M818,424 h3 v14 h-3 z"/>
  </g>
  <!-- Motion trail from the full size video to the PiP window -->
  <path d="M700,270 C690,330 700,380 728,402" fill="none" stroke="#7CE0C3" stroke-width="2.4" stroke-dasharray="6 7" stroke-linecap="round" opacity="0.8"/>
  <path d="M722,392 l10,12 l-15,2" fill="none" stroke="#7CE0C3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
